name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m uv sync --dev
      - run: |
          python -m pulser kb overview > demo_output.txt
          cat demo_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: demo-output
          path: demo_output.txt
